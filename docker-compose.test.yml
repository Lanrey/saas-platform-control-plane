version: '3.9'

# Test compose file — spins up isolated DB and Redis for integration tests
# Usage: docker-compose -f docker-compose.test.yml up -d
#        npm run test:e2e
#        docker-compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: platform-postgres-test
    environment:
      POSTGRES_DB: platform_mgmt_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test
    ports:
      - '5433:5432'
    volumes:
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d platform_mgmt_test']
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for speed

  redis-test:
    image: redis:7-alpine
    container_name: platform-redis-test
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /data  # In-memory for speed
